<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SignBridge{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% set ep = request.endpoint %}
  <header class="nav">
    <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">✋</span>SignBridge</a>
    <nav class="nav-links" aria-label="Main">
      <a href="{{ url_for('translate') }}" class="{{ 'active' if ep == 'translate' }}">Translate</a>
    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    SignBridge is an early prototype. It recognises a limited vocabulary and is not a replacement for a human interpreter.
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
